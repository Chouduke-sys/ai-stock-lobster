name: Archive Sector Capital Rotation
on:
  schedule:
    - cron: "20 7 * * 1-5"
    - cron: "20 8 * * 1-5"
    - cron: "20 9 * * 1-5"
    - cron: "20 10 * * 1-5"
    - cron: "20 11 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sector-flow-archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Capture available verified sector turnover
        run: node scripts/archive-sector-flow.cjs
      - name: Save dated archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sector-flow-history.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive dated industry turnover and capital rotation"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
