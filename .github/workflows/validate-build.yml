name: Validate Build and Automation Scripts
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate automation scripts
        run: |
          node --check scripts/archive-daily-review.cjs
          node --check scripts/archive-sector-flow.cjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript type check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
